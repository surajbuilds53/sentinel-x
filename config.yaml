# Sentinel-X: AI-Based Network Attack Forecasting Configuration
# SIH26153 Defensive Cybersecurity B.Tech Minor Project

project:
  name: "Sentinel-X"
  version: "1.0.0"
  description: "AI-Based Network Attack Forecasting from Network Traffic Data"
  random_seed: 42

environment:
  device: "auto"  # "auto", "cuda", or "cpu"
  num_workers: 0

paths:
  raw_data_dir: "data/raw"
  processed_data_dir: "data/processed"
  sample_data_dir: "data/sample"
  model_checkpoint_dir: "models/checkpoints"
  scaler_dir: "models/scalers"
  evaluation_dir: "models/evaluation"

data_pipeline:
  time_window_seconds: 10
  chronological_splits:
    train_ratio: 0.70
    val_ratio: 0.15
    test_ratio: 0.15
  sequence_length: 12        # Number of historical time-steps (T-11 ... T)
  forecast_horizon: 3        # Autoregressive forecast steps (T+1, T+2, T+3)
  label_column: "Label"
  timestamp_column: "Timestamp"

baseline:
  model_name: "LogisticRegression"
  penalty: "l2"
  C: 1.0
  max_iter: 1000
  solver: "lbfgs"
  model_save_path: "models/checkpoints/baseline_logistic_regression.joblib"
  scaler_save_path: "models/scalers/baseline_scaler.joblib"
  metrics_save_path: "models/evaluation/baseline_metrics.json"

lstm_world_model:
  model_name: "LSTMWorldModel"
  input_dim: 16             # Number of aggregated temporal network-state features
  hidden_size: 128
  num_layers: 2
  dropout: 0.3
  stage_classes: 5          # 0: Benign, 1: Recon, 2: Initial Access, 3: Lateral Movement, 4: C2
  
  training:
    epochs: 25
    batch_size: 32
    learning_rate: 0.002
    weight_decay: 1e-4
    early_stopping_patience: 8
    checkpoint_path: "models/checkpoints/lstm_world_model.pt"
    best_model_path: "models/checkpoints/best_lstm_world_model.pt"
    scaler_save_path: "models/scalers/lstm_state_scaler.joblib"
    metrics_save_path: "models/evaluation/lstm_metrics.json"

  loss_weights:
    risk_loss_weight: 1.0    # Binary Cross Entropy
    stage_loss_weight: 1.0   # Cross Entropy
    state_loss_weight: 0.2   # Mean Squared Error

taxonomy:
  stages:
    0:
      name: "Benign"
      tactic_id: "BENIGN"
      description: "Normal, expected network activity without malicious indicators."
    1:
      name: "Reconnaissance"
      tactic_id: "TA0043"
      description: "Adversary attempting to gather network structure and service information (e.g. port scanning, IP sweeping)."
    2:
      name: "Initial Access"
      tactic_id: "TA0001"
      description: "Adversary attempting to breach boundary defenses (e.g. brute force, vulnerability exploitation)."
    3:
      name: "Lateral Movement"
      tactic_id: "TA0008"
      description: "Adversary attempting to navigate internally across network segments and pivot between systems."
    4:
      name: "Command and Control"
      tactic_id: "TA0011"
      description: "Adversary establishing outbound control channels, beaconing, or communicating with remote infrastructure."

explainability:
  background_samples: 100
  test_samples: 20
  shap_save_path: "models/evaluation/shap_summary.json"

dashboard:
  title: "Sentinel-X | Defensive Network Attack Forecasting SOC"
  refresh_interval_seconds: 5
  demo_mode_default: true
